; Illustrative generated shape. Gear renders immutable private files per incarnation.
; Do not install this placeholder or edit a live program in place.
[program:model_<incarnation>]
command=/usr/bin/timeout --signal=KILL --kill-after=120s <remaining-original-deadline>s /opt/sglang-eval/bin/python -m sglang.launch_server --model-path <digest-addressed-readonly-snapshot> --host 127.0.0.1 --port 32000 --tp-size 1 --served-model-name gear-<incarnation> --api-key <private-instance-key> --tool-call-parser qwen25
autostart=false
autorestart=false
startsecs=0
startretries=0
stopsignal=KILL
stopasgroup=true
killasgroup=true
stopwaitsecs=120
environment=CUDA_VISIBLE_DEVICES="<reserved-evaluation-GPU-UUID>",GEAR_NATIVE_INCARNATION="<incarnation>",GEAR_NATIVE_INTENT="<intent-digest>",PYTHONUNBUFFERED="1"
umask=077
redirect_stderr=true
stdout_logfile=<private-group-directory>/model_<incarnation>.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
