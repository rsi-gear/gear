- id: hmr
  disabled: false
  config:
    root: []
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: kaggle-read-only
    presets:
      kaggle-read-only:
        sandbox: read-only
        approval: never
        name: Kaggle pipeline only
- id: tools
  config:
    mode: native
- insert:
    - id: llm-openai-codex
      name: dsh-codex
- insert:
    - id: target-harness-loader
      name: ./target-loader-shim.js
      config:
        repositoryRoot: !!js process.env.DSH_REFINE_REPOSITORY
- id: headless-runner
  inject: [headlessStartup, targetHarness]
  config:
    task: !!js ctx.headlessStartup.task
