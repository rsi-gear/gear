<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gear · Evolution loop</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #edf2f2;
        color: #263d44;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 1488px;
        margin: 40px auto;
        padding: 0 24px;
      }
      object {
        display: block;
        width: 100%;
        aspect-ratio: 1440/580;
        background: #fcfdfd;
        border-radius: 8px;
        box-shadow: 0 10px 60px #263d4410;
      }
      nav {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 20px;
        font-size: 13px;
      }
      button,
      a {
        font: inherit;
        color: inherit;
        padding: 9px 13px;
        border: 1px solid #cedbdd;
        border-radius: 6px;
        background: #fcfdfd;
        text-decoration: none;
        cursor: pointer;
      }
      button:hover,
      a:hover {
        border-color: #197f83;
      }
      input {
        flex: 1;
        min-width: 100px;
        accent-color: #197f83;
      }
      output {
        font-variant-numeric: tabular-nums;
        min-width: 94px;
        color: #73898f;
      }
      .spacer {
        flex: 1;
      }
      .meta {
        margin-top: 14px;
        font-size: 13px;
        color: #73898f;
        line-height: 1.5;
      }
      @media (max-width: 750px) {
        main {
          margin: 20px auto;
          padding: 0 12px;
        }
        .spacer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <object
        id="animation"
        data="gear-loop-light.svg"
        type="image/svg+xml"
        aria-label="Gear evolution loop"
      ></object>
      <nav aria-label="Animation playback">
        <button id="play" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
        <input
          id="time"
          type="range"
          min="0"
          max="11.99"
          step="0.01"
          value="0"
          aria-label="Animation time in seconds"
        />
        <output id="readout">0.00 / 12s</output>
        <button id="complete" type="button">Full diagram</button>
        <a href="gear-loop-light.svg" download>Download SVG</a>
        <a href="http://localhost:3000/GearLoop">Remotion Studio</a>
      </nav>
      <p class="meta">12-second loop · Serve → Diagnose → Evolve → Repeat</p>
    </main>
    <script>
      const animation = document.querySelector("#animation");
      const play = document.querySelector("#play");
      const slider = document.querySelector("#time");
      const readout = document.querySelector("#readout");
      const animations = () => animation.contentDocument?.getAnimations() ?? [];
      const pause = () => {
        animations().forEach((a) => a.pause());
        play.textContent = "Play";
      };
      const seek = async (seconds) => {
        const list = animations();
        pause();
        await Promise.all(list.map((a) => a.ready));
        list.forEach((a) => (a.currentTime = seconds * 1000));
        slider.value = seconds;
        readout.textContent = Number(seconds).toFixed(2) + " / 12s";
      };
      play.addEventListener("click", () => {
        const list = animations();
        if (list.some((a) => a.playState === "running")) pause();
        else {
          list.forEach((a) => a.play());
          play.textContent = "Pause";
        }
      });
      document.querySelector("#restart").addEventListener("click", () => {
        animations().forEach((a) => {
          a.currentTime = 0;
          a.play();
        });
        play.textContent = "Pause";
      });
      document
        .querySelector("#complete")
        .addEventListener("click", () => seek(10.8));
      slider.addEventListener("input", () => seek(Number(slider.value)));
      const tick = () => {
        const first = animations()[0];
        if (first) {
          const seconds = (Number(first.currentTime) % 12000) / 1000;
          slider.value = seconds;
          readout.textContent = seconds.toFixed(2) + " / 12s";
        }
        requestAnimationFrame(tick);
      };
      animation.addEventListener("load", () => {
        if (!animations().length) {
          play.disabled = true;
          slider.disabled = true;
          document.querySelector("#restart").disabled = true;
          document.querySelector("#complete").disabled = true;
          play.textContent = "Reduced motion";
        }
      });
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
