name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
      macos: ${{ steps.select.outputs.macos }}
      full_tests: ${{ steps.select.outputs.full_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Compare the entire push or PR, including deleted and renamed files.
          fetch-depth: 0
      - name: Check CI and release rules
        run: node --test .github/scripts/*.test.mjs
      - name: Select jobs from changed paths
        id: select
        run: node .github/scripts/ci-changes.mjs

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python RPC dependencies
        run: |
          python -m pip install './python[dev,deployment]' -c python/constraints-test.txt
          echo "GEAR_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "GEAR_TRAINING_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Install sandbox dependencies
        if: needs.changes.outputs.full_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap ripgrep socat
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:contracts
      - run: npm run check:boundaries
      - run: python -m ruff check python/gear
      - run: python -m ruff format --check python/gear
      - run: python -m mypy
        working-directory: python
      - run: npm run typecheck
      - run: npm run build
      # Architecture changes on dev and main both run the complete regression suite.
      - name: Test as the production service user
        if: needs.changes.outputs.full_tests == 'true'
        run: sudo env "PATH=$PATH" "GEAR_PYTHON=$GEAR_PYTHON" "GEAR_TRAINING_TEST_PYTHON=$GEAR_TRAINING_TEST_PYTHON" npm test -- --maxWorkers=4
      # The build above already ran the same command as the prepack hook.
      - run: npm pack --dry-run --ignore-scripts
      - name: Verify the packed tarball installs globally
        run: node scripts/check-global-install.mjs
      - name: Test the published project API from an external package
        run: node scripts/check-public-api-package.mjs
      - name: Test the installed npm and Python project journey
        run: sudo env "PATH=$PATH" "GEAR_PYTHON=$GEAR_PYTHON" "GEAR_SETUP_PYTHON=$GEAR_PYTHON" node scripts/check-project-package.mjs

  training-cpu:
    name: Training / CPU
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/constraints-test.txt
      - name: Install CPU training bridge dependencies
        run: |
          python -m pip install './python[gateway,deployment]' -c python/constraints-test.txt
          python -m pip install torch -c python/constraints-test.txt --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers tokenizers safetensors numpy -c python/constraints-test.txt
      - name: Test the CPU training bridge
        run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python

  sandbox-linux:
    name: Sandbox / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap ripgrep socat
      - run: npm ci
      - name: Test as the production service user
        run: sudo env "PATH=$PATH" "GEAR_PYTHON=$(command -v python)" "GEAR_TRAINING_TEST_PYTHON=$(command -v python)" npm run test:sandbox:platform

  sandbox-macos:
    name: Sandbox / macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: GEAR_PYTHON="$(command -v python)" GEAR_TRAINING_TEST_PYTHON="$(command -v python)" npm run test:sandbox:platform
