name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.select.outputs.code }}
      macos: ${{ steps.select.outputs.macos }}
      full_tests: ${{ steps.select.outputs.full_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Compare the entire push or PR, including deleted and renamed files.
          fetch-depth: 0
      - name: Check CI and release rules
        run: node --test .github/scripts/*.test.mjs
      - name: Select jobs from changed paths
        id: select
        run: node .github/scripts/ci-changes.mjs

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.full_tests == 'true'
        with:
          python-version: '3.12'
      - name: Install Python RPC dependencies
        if: needs.changes.outputs.full_tests == 'true'
        run: python -m pip install ./python -c python/constraints-test.txt
      - name: Install sandbox dependencies
        if: needs.changes.outputs.full_tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap ripgrep socat
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Keep dev checks fast; run regression tests for main or manual runs.
      - name: Test as the production service user
        if: needs.changes.outputs.full_tests == 'true'
        run: sudo env "PATH=$PATH" npm test
      # The build above already ran the same command as the prepack hook.
      - run: npm pack --dry-run --ignore-scripts
      - name: Test the published search API from an external package
        run: node scripts/check-search-package.mjs

  training-cpu:
    name: Training / CPU
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            python/constraints-test.txt
      - name: Install CPU training bridge dependencies
        run: |
          python -m pip install './python[gateway]' -c python/constraints-test.txt
          python -m pip install torch -c python/constraints-test.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Test the CPU training bridge
        run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python

  sandbox-linux:
    name: Sandbox / Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap ripgrep socat
      - run: npm ci
      - name: Test as the production service user
        run: sudo env "PATH=$PATH" npm run test:sandbox:platform
      - name: Install the fixed Target runtime
        run: |
          npm install --global pnpm@11.7.0
          node examples/dsh-codex-luna/bootstrap-target.mjs
        env:
          GEAR_LAB_ROOT: ${{ runner.temp }}/gear-runtime-contract
      - name: Check real Target loading and native Skill reads in the sandbox
        run: sudo env "PATH=$PATH" "GEAR_TEST_DSH_RUNTIME_ROOT=$GEAR_TEST_DSH_RUNTIME_ROOT" GEAR_TEST_RUNTIME_SANDBOX=required node node_modules/vitest/vitest.mjs run tests/integration/dsh-runtime-check.spec.ts
        env:
          GEAR_TEST_DSH_RUNTIME_ROOT: ${{ runner.temp }}/gear-runtime-contract/target-dsh

  sandbox-macos:
    name: Sandbox / macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run test:sandbox:platform

  hitch-rerun-contract:
    name: Hitch rerun contract
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: rsi-gear/agent-hitch
          # Companion contract: durable client rerun identity and cancellation.
          ref: 90d4cc3a5d98df53b02e57b54762e16ac1c6d942
          path: .hitch-contract
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: .hitch-contract
      # Build the pinned dependency; Hitch's own CI owns its full unit suite.
      # This job exercises the real CLI/daemon through Gear's contract below.
      - name: Build the pinned Hitch contract
        run: npm run build
        working-directory: .hitch-contract
      - name: Verify Gear against the real Hitch CLI and daemon
        run: npm test -- tests/integration/hitch-rerun-contract.spec.ts
        env:
          HITCH_CONTRACT_ROOT: ${{ github.workspace }}/.hitch-contract
