<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 100 1440 580" fill="none" role="img" aria-labelledby="gear-title gear-desc" style="font-family:-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif"><title id="gear-title">Gear — inner and outer evolution loops</title><desc id="gear-desc">A twelve-second animation of Gear&#x27;s evolution architecture. Inner loop: a Rollout Agent, composed of a harness and model, serves each task by exchanging actions, observations and rewards with an environment. Outer loop: the Meta Agent diagnoses cross-task trajectories and feedback, then edits the harness, designs seed tasks and drives model training. The evolved harness, tasks and model feed directly back into the inner loop for the next iteration.</desc><rect y="100" width="1440" height="580" fill="#fcfdfd"></rect><g data-cue="serve" style="opacity:1"><rect x="114" y="214" width="536" height="282" rx="23" fill="#f0f3f9" stroke="#d6dfeb" stroke-width="1.2"></rect><rect x="102" y="226" width="536" height="282" rx="23" fill="#faf6ed" stroke="#e8dfcc" stroke-width="1.2"></rect><rect x="90" y="238" width="536" height="282" rx="23" fill="#f3f9f8" stroke="#b8d7d3" stroke-width="1.5"></rect><text x="116" y="277" font-size="23" fill="#197f83" font-weight="600" text-anchor="start">Inner loop</text><text x="254" y="277" font-size="17" fill="#73898f" font-weight="400" text-anchor="start">Interact within each task</text><text x="356" y="202" font-size="27" fill="#263d44" font-weight="600" text-anchor="middle">Serve</text><text x="595" y="276" font-size="14" fill="#73898f" font-weight="400" text-anchor="end">Task i</text><path d="M116 294H598" stroke="#dce9e6"></path><rect x="112" y="333" width="215" height="116" rx="12" stroke="#b5c7ca" stroke-width="1.4" fill="white"></rect><text x="219.5" y="365" font-size="21" fill="#263d44" font-weight="600" text-anchor="middle">Rollout Agent</text><rect x="130" y="387" width="83" height="39" 